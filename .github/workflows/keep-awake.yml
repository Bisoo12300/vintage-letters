# Render free plan sleeps after ~15 min idle. Ping every 15 min to keep it awake
# and run the reminder pass. GitHub may delay scheduled runs by a few minutes.
name: Keep Render awake

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://vintage-letters-ugvr.onrender.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake server
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 "$API_URL/api/health"
      - name: Run reminders
        if: env.CRON_SECRET != ''
        run: |
          curl -fsS --max-time 90 -X POST -H "x-cron-secret: $CRON_SECRET" "$API_URL/api/cron/reminders"
