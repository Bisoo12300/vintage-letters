services:
  - type: web
    name: vintage-letters-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: READER_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Reminder pushes (1 week / 1 day before plans and moments)
      - key: REMINDERS_ENABLED
        value: "1"
      - key: REMINDER_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Free plan sleeps when idle — an external cron should POST /api/cron/reminders with this as x-cron-secret
      - key: CRON_SECRET
        sync: false
