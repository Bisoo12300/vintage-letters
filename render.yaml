services:
  - type: web
    name: vintage-letters-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: READER_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
